<!DOCTYPE html>
<html lang="pt-br">

<head>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Esperança</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Cadastro de Voluntários</h1>
    </header>

    <nav>

        <button class="menu-toggle">☰</button>

        <div class="menu">

            <a href="index.html">Início</a>

            <div class="dropdown">
                <a href="#">Projetos ▾</a>

                <div class="dropdown-content">
                    <a href="projetos.html">Nossos Projetos</a>
                    <a href="projetos.html">Campanhas</a>
                    <a href="projetos.html">Voluntariado</a>
                </div>
            </div>

            <a href="cadastro.html">Cadastro</a>

        </div>

    </nav>

    <main class="grid-container">

        <form>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>

            </fieldset>

            <br>

            <fieldset>
                <legend>Endereço</legend>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <br><br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <br><br>

                <label for="estado">Estado:</label>

                <select id="estado" name="estado" required>
                    <option value="">Selecione seu estado</option>

                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

                <br><br>

                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    pattern="[0-9]{8}"
                    title="Digite o CEP com 8 números."
                    required
                >

            </fieldset>

            <br>

            <fieldset>
                <legend>Dados para contato</legend>

                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    pattern="[0-9]{10,11}"
                    title="Digite o telefone com 10 ou 11 números."
                    required
                >

                <br><br>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="[0-9]{11}"
                    title="Digite o CPF com 11 números."
                    required
                >

            </fieldset>

            <br>

            <button type="submit">Enviar cadastro</button>

        </form>

    </main>

    <footer>
        <p>ONG Esperança - Todos os direitos reservados.</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
